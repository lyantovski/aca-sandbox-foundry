{{- $root := . -}}
{{- range $agent := list
  (dict "name" "research" "image" $.Values.images.research.repository "port" 8001 "otelName" "research-agent" "runAsUser" 10001)
  (dict "name" "creator" "image" $.Values.images.creator.repository "port" 8002 "otelName" "creator-agent" "runAsUser" 1654)
  (dict "name" "podcaster" "image" $.Values.images.podcaster.repository "port" 8003 "otelName" "podcaster-agent" "runAsUser" 10001)
}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-{{ $agent.name }}
  namespace: {{ $root.Values.global.namespace }}
  labels:
    app.kubernetes.io/name: agent-{{ $agent.name }}
    {{- include "content-factory.labels" $root | nindent 4 }}
spec:
  replicas: {{ $root.Values.replicas.agents }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-{{ $agent.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-{{ $agent.name }}
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ $agent.name }}
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        {{- toYaml $root.Values.global.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml $root.Values.global.tolerations | nindent 8 }}
      containers:
        - name: agent-{{ $agent.name }}
          image: {{ include "content-factory.image" (list $root $agent.image (index $root.Values.images $agent.name).tag) }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $agent.port }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: {{ $agent.runAsUser }}
          env:
            - name: AZURE_CLIENT_ID
              value: {{ index $root.Values.global.workloadIdentityClientIds $agent.name | quote }}
            - name: AZURE_OPENAI_ENDPOINT
              value: {{ $root.Values.config.foundryEndpoint | quote }}
            - name: AZURE_OPENAI_DEPLOYMENT
              value: {{ $root.Values.config.chatDeploymentName | quote }}
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ $root.Values.secrets.modelApiKeyKey }}
            - name: A2A_AUTH_ENABLED
              value: "true"
            - name: A2A_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ $root.Values.secrets.a2aTokenKey }}
            - name: AGENT_BASE_URL
              value: http://agent-{{ $agent.name }}:{{ $agent.port }}
            - name: OTEL_SERVICE_NAME
              value: {{ $agent.otelName }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $root.Values.config.otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            {{- if eq $agent.name "research" }}
            - name: ACA_SANDBOX_BROKER_URL
              value: http://sandbox-broker:8010
            - name: ACA_SANDBOX_BROKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ $root.Values.secrets.brokerTokenKey }}
            {{- end }}
            {{- if eq $agent.name "podcaster" }}
            - name: AZURE_STORAGE_ACCOUNT_NAME
              value: {{ $root.Values.config.storageAccountName | quote }}
            - name: CONTENT_FACTORY_MODE
              value: lab
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml $root.Values.resources.agents | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-{{ $agent.name }}
  namespace: {{ $root.Values.global.namespace }}
  {{- if $root.Values.privateAgentOrigins.enabled }}
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-ipv4: {{ required (printf "privateAgentOrigins.ips.%s is required" $agent.name) (index $root.Values.privateAgentOrigins.ips $agent.name) | quote }}
  {{- end }}
spec:
  type: {{ ternary "LoadBalancer" "ClusterIP" $root.Values.privateAgentOrigins.enabled }}
  {{- if $root.Values.privateAgentOrigins.enabled }}
  externalTrafficPolicy: Local
  loadBalancerSourceRanges:
    - {{ required "privateAgentOrigins.allowedSourceCidr is required" $root.Values.privateAgentOrigins.allowedSourceCidr | quote }}
  {{- end }}
  selector:
    app.kubernetes.io/name: agent-{{ $agent.name }}
  ports:
    - name: http
      port: {{ $agent.port }}
      targetPort: http
{{- end }}
