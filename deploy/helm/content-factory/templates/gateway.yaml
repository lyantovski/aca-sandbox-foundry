{{- if .Values.gateway.enabled }}
apiVersion: alb.networking.azure.io/v1
kind: HealthCheckPolicy
metadata:
  name: bff
  namespace: {{ .Values.global.namespace }}
spec:
  targetRef:
    group: ""
    kind: Service
    name: bff
  default:
    port: 4180
    http:
      path: /ping
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: content-factory
  namespace: {{ .Values.global.namespace }}
  annotations:
    alb.networking.azure.io/alb-id: {{ required "gateway.applicationGatewayId is required when gateway.enabled=true" .Values.gateway.applicationGatewayId | quote }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ required "gateway.hostname is required when gateway.enabled=true" .Values.gateway.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.gateway.certificateSecretName }}
      allowedRoutes:
        namespaces:
          from: Same
  addresses:
    - type: alb.networking.azure.io/alb-frontend
      value: {{ .Values.gateway.frontendName | quote }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: content-factory
  namespace: {{ .Values.global.namespace }}
spec:
  parentRefs:
    - name: content-factory
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2
      backendRefs:
        - name: bff
          port: 8081
    - matches:
        - path:
            type: PathPrefix
            value: /api
      timeouts:
        request: 600s
        backendRequest: 600s
      backendRefs:
        - name: bff
          port: 8081
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dev-ui
          port: 8080
{{- end }}
