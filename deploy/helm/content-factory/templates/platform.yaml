apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: bff
    {{- include "content-factory.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.bff }}
  selector:
    matchLabels:
      app.kubernetes.io/name: bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bff
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: bff
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bff
          image: {{ include "content-factory.image" (list . .Values.images.bff.repository .Values.images.bff.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10001
          ports:
            - name: bff-http
              containerPort: 8081
          env:
            - name: AUTH_REQUIRED
              value: {{ .Values.entra.enabled | quote }}
            - name: RESEARCH_AGENT_URL
              value: {{ .Values.config.agentUrls.research | quote }}
            - name: CREATOR_AGENT_URL
              value: {{ .Values.config.agentUrls.creator | quote }}
            - name: PODCASTER_AGENT_URL
              value: {{ .Values.config.agentUrls.podcaster | quote }}
            - name: A2A_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.a2aTokenKey }}
            - name: OTEL_SERVICE_NAME
              value: content-factory-bff
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: bff-http
          resources:
            {{- toYaml .Values.resources.platform | nindent 12 }}
        {{- if .Values.entra.enabled }}
        - name: oauth2-proxy
          image: {{ .Values.images.oauthProxy.repository }}:{{ .Values.images.oauthProxy.tag }}
          imagePullPolicy: IfNotPresent
          args:
            - --provider=oidc
            - --oidc-issuer-url={{ required "entra.oidcIssuerUrl is required when entra.enabled=true" .Values.entra.oidcIssuerUrl }}
            - --client-id={{ required "entra.clientId is required when entra.enabled=true" .Values.entra.clientId }}
            - --client-secret=$(OAUTH2_PROXY_CLIENT_SECRET)
            - --cookie-secret=$(OAUTH2_PROXY_COOKIE_SECRET)
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --email-domain=*
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:8081
            - --upstream-timeout=10m
            - --redirect-url=https://{{ required "gateway.hostname is required when entra.enabled=true" .Values.gateway.hostname }}/oauth2/callback
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.oauthClientSecretKey }}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.oauthCookieSecretKey }}
          ports:
            - name: auth-proxy
              containerPort: 4180
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65532
          readinessProbe:
            httpGet:
              path: /ping
              port: auth-proxy
          resources:
            {{- toYaml .Values.resources.platform | nindent 12 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bff
  ports:
    - name: http
      port: 8081
      targetPort: {{ ternary "auth-proxy" "bff-http" .Values.entra.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-broker
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: sandbox-broker
    {{- include "content-factory.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.sandboxBroker }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-broker
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: sandbox-broker
      terminationGracePeriodSeconds: 90
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandbox-broker
          image: {{ include "content-factory.image" (list . .Values.images.sandboxBroker.repository .Values.images.sandboxBroker.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10001
          ports:
            - name: http
              containerPort: 8010
          env:
            - name: AZURE_CLIENT_ID
              value: {{ .Values.global.workloadIdentityClientIds.sandboxBroker | quote }}
            - name: AZURE_SUBSCRIPTION_ID
              value: {{ .Values.config.sandboxSubscriptionId | quote }}
            - name: ACA_SANDBOX_RESOURCE_GROUP
              value: {{ .Values.config.sandboxResourceGroup | quote }}
            - name: ACA_SANDBOX_GROUP_NAME
              value: {{ .Values.config.sandboxGroupName | quote }}
            - name: ACA_SANDBOXGROUP_REGION
              value: {{ .Values.config.sandboxRegion | quote }}
            - name: ACA_SANDBOX_RETENTION_SECONDS
              value: {{ .Values.config.sandboxRetentionSeconds | quote }}
            - name: ACA_SANDBOX_BROKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.brokerTokenKey }}
            - name: OTEL_SERVICE_NAME
              value: sandbox-broker
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.config.otlpEndpoint | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.resources.platform | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-broker
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sandbox-broker
  ports:
    - name: http
      port: 8010
      targetPort: http
